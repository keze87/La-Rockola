<!doctype html>
<html lang="es" style="background-color: #1f1a17">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
		/>
		<!-- Tells the browser the page is in dark mode -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#1f1a17" />

		<title>La Rockola del Carpincho 🦦🧉</title>
		<script>
			// Ensure trailing slash only for directory subpaths (e.g. /rockola -> /rockola/), NEVER for SPA routes
			(function () {
				const spaRoutes = [
					'fogon',
					'queue',
					'ronda',
					'vibra',
					'top',
					'clasicos',
					'controls',
					'perillas',
					'temazos',
					'library',
					'letras',
					'lyrics',
				];
				const segments = window.location.pathname.split('/').filter(Boolean);
				const last = segments[segments.length - 1];
				if (last && spaRoutes.includes(last.toLowerCase())) {
					return;
				}
				if (
					!window.location.pathname.endsWith('/') &&
					!window.location.pathname.split('/').pop().includes('.')
				) {
					window.location.replace(
						window.location.pathname + '/' + window.location.search + window.location.hash
					);
				}
			})();
		</script>
		<link rel="icon" type="image/png" href="./favicon.png" />
		<link rel="apple-touch-icon" href="./icon-192.png" />
		<link rel="manifest" href="./manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
	</head>

	<body class="text-carpincho-text font-sans antialiased" style="background-color: #1f1a17">
		<!-- Vue attaches your application here -->
		<div id="app">
			<div
				style="
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					height: 100dvh;
					width: 100%;
					background-color: #1f1a17;
					color: #e8d5c4;
					font-family:
						system-ui,
						-apple-system,
						sans-serif;
					gap: 14px;
				"
			>
				<img
					src="./icon-192.png"
					alt="La Rockola del Carpincho"
					style="width: 84px; height: 84px; border-radius: 20px"
				/>
				<span style="font-size: 0.95rem; font-weight: 700; letter-spacing: 0.04em; opacity: 0.9">
					Prendiendo la rockola... 🧉
				</span>
			</div>
		</div>

		<!-- Vite injects the compiled application through this module -->
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
