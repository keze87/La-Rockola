name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        name: Build Windows Portable Executable
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Windows Portable Executable
              run: |
                  python scripts/build_windows.py

            - name: Set artifact date
              id: artifact-date
              shell: pwsh
              run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

            - name: Upload Windows Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-windows-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/larockola-windows-x86_64.zip

    build-linux-appimage:
        name: Build Linux AppImage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Linux AppImage
              run: |
                  python scripts/build_appimage.py

            - name: Set artifact date
              id: artifact-date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: Upload Linux AppImage Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-linux-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/LaRockola-x86_64.AppImage

    build-android:
        name: Build Signed Android APK (arm64)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Set up Gradle cache
              uses: gradle/actions/setup-gradle@v4

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Decode Android Release Keystore
              env:
                  ROCKOLA_KEYSTORE_BASE64: ${{ secrets.ROCKOLA_KEYSTORE_BASE64 }}
                  KEYSTORE_DEST: ${{ runner.temp }}/rockola-release.jks
              run: |
                  if [ -z "$ROCKOLA_KEYSTORE_BASE64" ]; then
                    echo "❌ Falta secret ROCKOLA_KEYSTORE_BASE64 para firmar release Android" >&2
                    exit 1
                  fi
                  printf '%s' "$ROCKOLA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"

            - name: Build Signed Release APK & verify 16 KB alignment
              env:
                  ROCKOLA_KEYSTORE_PATH: ${{ runner.temp }}/rockola-release.jks
                  ROCKOLA_KEYSTORE_PASSWORD: ${{ secrets.ROCKOLA_KEYSTORE_PASSWORD }}
                  ROCKOLA_KEY_ALIAS: ${{ secrets.ROCKOLA_KEY_ALIAS }}
                  ROCKOLA_KEY_PASSWORD: ${{ secrets.ROCKOLA_KEY_PASSWORD }}
              run: |
                  python3 scripts/build_android.py --skip-frontend --flavor arm64 --release

            - name: Verify APK 16KB ELF, ZIP alignment & SHA-256 checksum
              run: |
                  APK_FILE="$(ls android/app/build/outputs/apk/arm64/release/*.apk | head -n 1)"
                  SHA_FILE="${APK_FILE}.sha256"
                  if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
                    echo "❌ No se encontró el APK release firmado" >&2
                    exit 1
                  fi
                  if [ ! -s "$SHA_FILE" ]; then
                    echo "❌ Falta archivo checksum $SHA_FILE" >&2
                    exit 1
                  fi
                  (cd "$(dirname "$APK_FILE")" && sha256sum -c "$(basename "$SHA_FILE")")
                  python3 scripts/verify_android_apk.py "$APK_FILE"

            - name: Verify APK v2/v3/v4 signature with apksigner
              env:
                  EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
              run: |
                  APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
                  APK_FILE="$(ls android/app/build/outputs/apk/arm64/release/*.apk | head -n 1)"
                  CERT_OUT="$("$APKSIGNER" verify --print-certs "$APK_FILE")"
                  echo "$CERT_OUT"
                  if [ -z "$EXPECTED_CERT_SHA256" ]; then
                    echo "❌ ANDROID_SIGNING_CERT_SHA256 no configurado: es obligatorio verificar el fingerprint de firma en release." >&2
                    exit 1
                  fi
                  ACTUAL_SHA256="$(printf '%s\n' "$CERT_OUT" | sed -n 's/.*SHA-256 digest: \([0-9a-fA-F:]*\).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
                  NORM_EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
                  if [ "$ACTUAL_SHA256" != "$NORM_EXPECTED" ]; then
                    echo "❌ El fingerprint SHA-256 del certificado ($ACTUAL_SHA256) no coincide con ANDROID_SIGNING_CERT_SHA256 ($NORM_EXPECTED)" >&2
                    exit 1
                  fi
                  echo "✅ Fingerprint SHA-256 de firma verificado: $ACTUAL_SHA256"

            - name: Upload Android Release Artifact & R8 Mapping
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-android-arm64-release
                  path: |
                      android/app/build/outputs/apk/arm64/release/*.apk
                      android/app/build/outputs/apk/arm64/release/*.apk.sha256
                      android/app/build/outputs/mapping/arm64Release/mapping.txt

            - name: Clean up temporary keystore
              if: always()
              run: rm -f "${{ runner.temp }}/rockola-release.jks"

    publish-release:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build-windows, build-linux-appimage, build-android]
        runs-on: ubuntu-latest
        steps:
            - name: Download all release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts

            - name: Publish single GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      release-artifacts/**/*.zip
                      release-artifacts/**/*.AppImage
                      release-artifacts/**/*.apk
                      release-artifacts/**/*.apk.sha256
                  draft: false
                  prerelease: false
                  generate_release_notes: true
