name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        name: Build Windows Portable Executable
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Windows Portable Executable
              run: |
                  python scripts/build_windows.py

            - name: Set artifact date
              id: artifact-date
              shell: pwsh
              run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

            - name: Upload Windows Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-windows-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/larockola-windows-x86_64

            - name: Publish GitHub Release (if tagged)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: release/larockola-windows-x86_64.zip
                  draft: false
                  prerelease: false
                  generate_release_notes: true

    build-linux-appimage:
        name: Build Linux AppImage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Linux AppImage
              run: |
                  python scripts/build_appimage.py

            - name: Set artifact date
              id: artifact-date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: Upload Linux AppImage Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-linux-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/LaRockola-x86_64.AppImage

            - name: Publish GitHub Release (if tagged)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: release/LaRockola-x86_64.AppImage
                  draft: false
                  prerelease: false
                  generate_release_notes: true

    build-android:
        name: Build Signed Android APK (arm64)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
                  cache: 'pip'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Decode Android Release Keystore
              run: |
                  if [ -z "${{ secrets.ROCKOLA_KEYSTORE_BASE64 }}" ]; then
                    echo "❌ Falta secret ROCKOLA_KEYSTORE_BASE64 para firmar release Android" >&2
                    exit 1
                  fi
                  echo "${{ secrets.ROCKOLA_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/rockola-release.jks"

            - name: Build Signed Release APK & verify 16 KB alignment
              env:
                  ROCKOLA_KEYSTORE_PATH: ${{ runner.temp }}/rockola-release.jks
                  ROCKOLA_KEYSTORE_PASSWORD: ${{ secrets.ROCKOLA_KEYSTORE_PASSWORD }}
                  ROCKOLA_KEY_ALIAS: ${{ secrets.ROCKOLA_KEY_ALIAS }}
                  ROCKOLA_KEY_PASSWORD: ${{ secrets.ROCKOLA_KEY_PASSWORD }}
              run: |
                  python3 scripts/build_android.py --skip-frontend --flavor arm64 --release

            - name: Upload Android Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-android-arm64-release
                  path: |
                      android/app/build/outputs/apk/arm64/release/*.apk
                      android/app/build/outputs/apk/arm64/release/*.apk.sha256

            - name: Publish Android APK to GitHub Release (if tagged)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      android/app/build/outputs/apk/arm64/release/*.apk
                      android/app/build/outputs/apk/arm64/release/*.apk.sha256
                  draft: false
                  prerelease: false
                  generate_release_notes: true
