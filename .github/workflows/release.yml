name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        name: Build Windows Portable Executable
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Windows Portable Executable
              run: |
                  python scripts/build_windows.py

            - name: Set artifact date
              id: artifact-date
              shell: pwsh
              run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

            - name: Upload Windows Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-windows-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/larockola-windows-x86_64

            - name: Publish GitHub Release (if tagged)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: release/larockola-windows-x86_64.zip
                  draft: false
                  prerelease: false
                  generate_release_notes: true

    build-linux-appimage:
        name: Build Linux AppImage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies and build frontend
              run: |
                  npm ci
                  npm run build

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies & PyInstaller
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller pillow

            - name: Build Linux AppImage
              run: |
                  python scripts/build_appimage.py

            - name: Set artifact date
              id: artifact-date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: Upload Linux AppImage Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: larockola-linux-x86_64-${{ steps.artifact-date.outputs.date }}
                  path: release/LaRockola-x86_64.AppImage

            - name: Publish GitHub Release (if tagged)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: release/LaRockola-x86_64.AppImage
                  draft: false
                  prerelease: false
                  generate_release_notes: true
