name: Tests

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    backend:
        name: Backend Lint & Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y mpv

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt ruff

            - name: Run ruff check
              run: |
                  ruff check .

            - name: Run pytest with coverage
              run: |
                  pytest --md-report --md-report-color=never --md-report-flavor=github --md-report-zeros=empty --md-report-output=pytest_report.md

            - name: Publish Test and Coverage Summary to GITHUB_STEP_SUMMARY
              if: always()
              run: |
                  {
                      if [ -f "pytest_report.md" ]; then
                          echo "### 🧪 Pytest Test Report"
                          echo ""
                          cat pytest_report.md
                          echo ""
                      fi
                      if [ -f ".coverage" ]; then
                          echo "### 📊 Backend Coverage Report"
                          echo ""
                          coverage report --format=markdown
                      fi
                  } | head -c 950000 >> $GITHUB_STEP_SUMMARY

    frontend:
        name: Frontend Lint & Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies
              run: |
                  npm ci

            - name: Run ESLint
              run: |
                  npm run lint

            - name: Run vitest with coverage
              run: |
                  npm run test:coverage

            - name: Check build
              run: |
                  npm run build

    android:
        name: Android Unit Tests & 16 KB APK Verification
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Set up Gradle cache
              uses: gradle/actions/setup-gradle@v5

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'

            - name: Install dependencies & build frontend
              run: |
                  npm ci
                  npm run build

            - name: Sync Android assets & run Kotlin unit tests
              run: |
                  python3 scripts/build_android.py --skip-frontend --sync-only
                  ./android/gradlew -p android testArm64DebugUnitTest --no-daemon

            - name: Build Debug APK & verify 16 KB alignment
              run: |
                  python3 scripts/build_android.py --skip-frontend --flavor arm64
                  python3 scripts/verify_android_apk.py android/app/build/outputs/apk/arm64/debug/*.apk

    android-instrumented:
        name: Android Instrumented Smoke Test (x86_64)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Enable KVM for Android emulator
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Set up Gradle cache
              uses: gradle/actions/setup-gradle@v5

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'

            - name: Install dependencies, build frontend & sync Android
              run: |
                  npm ci
                  npm run build
                  python3 scripts/build_android.py --skip-frontend --sync-only

            - name: Cache Android AVD
              uses: actions/cache@v5
              id: avd-cache
              with:
                  path: |
                      ~/.android/avd/*
                      ~/.android/adb*
                  key: avd-api34-x86_64-pixel6-v1

            - name: Create AVD and generate snapshot for caching
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  profile: pixel_6
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "AVD snapshot listo"

            - name: Run EmbeddedRuntimeSmokeTest on x86_64 emulator (R8 releaseSmoke)
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  profile: pixel_6
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: ./android/gradlew -p android -PROCKOLA_TEST_BUILD_TYPE=releaseSmoke connectedX86_64ReleaseSmokeAndroidTest --no-daemon
