name: Tests

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    backend:
        name: Backend Lint & Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y mpv

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt ruff

            - name: Run ruff check
              run: |
                  ruff check .

            - name: Run pytest with coverage
              run: |
                  pytest --md-report --md-report-color=never --md-report-flavor=github --md-report-zeros=empty --md-report-show-duration --md-report-output=pytest_report.md

            - name: Publish Test and Coverage Summary to GITHUB_STEP_SUMMARY
              if: always()
              run: |
                  {
                      if [ -f "pytest_report.md" ]; then
                          echo "### 🧪 Pytest Test Report"
                          echo ""
                          cat pytest_report.md
                          echo ""
                      fi
                      if [ -f ".coverage" ]; then
                          echo "### 📊 Backend Coverage Report"
                          echo ""
                          coverage report --format=markdown
                      fi
                  } | head -c 950000 >> $GITHUB_STEP_SUMMARY

    frontend:
        name: Frontend Lint & Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node dependencies
              run: |
                  npm ci

            - name: Run ESLint
              run: |
                  npm run lint

            - name: Run vitest with coverage
              run: |
                  npm run test:coverage

            - name: Check build
              run: |
                  npm run build
