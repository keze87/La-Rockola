apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.chaquo.python'

def buildUtcCal = Calendar.getInstance(TimeZone.getTimeZone('UTC'))
// Código base monotónico por minuto en UTC: garantiza superación del esquema previo yyMMdd (<= 261124) sin desbordar Play Console.
def computedVersionCode = (
    (buildUtcCal.get(Calendar.YEAR) - 2020) * 1000000 +
    buildUtcCal.get(Calendar.DAY_OF_YEAR) * 1440 +
    buildUtcCal.get(Calendar.HOUR_OF_DAY) * 60 +
    buildUtcCal.get(Calendar.MINUTE)
)
def computedVersionName = String.format(
    '%02d.%02d.%02d-%02d%02d',
    buildUtcCal.get(Calendar.YEAR) % 100,
    buildUtcCal.get(Calendar.MONTH) + 1,
    buildUtcCal.get(Calendar.DAY_OF_MONTH),
    buildUtcCal.get(Calendar.HOUR_OF_DAY),
    buildUtcCal.get(Calendar.MINUTE),
)
def rawVersionCode = project.findProperty('ROCKOLA_VERSION_CODE')?.toString()?.trim()
    ?: System.getenv('ROCKOLA_VERSION_CODE')?.trim()
def rawVersionName = project.findProperty('ROCKOLA_VERSION_NAME')?.toString()?.trim()
    ?: System.getenv('ROCKOLA_VERSION_NAME')?.trim()
def baseVersionCode = rawVersionCode ? rawVersionCode.toInteger() : computedVersionCode
if (baseVersionCode <= 0 || (baseVersionCode.longValue() * 10L + 2L) > 2100000000L) {
    throw new GradleException("ROCKOLA_VERSION_CODE fuera de rango válido Android (1..209999999): ${baseVersionCode}")
}
def baseVersionName = rawVersionName ?: computedVersionName
def ignoreKeystoreProps = project.hasProperty('ROCKOLA_IGNORE_KEYSTORE_PROPS') &&
    project.property('ROCKOLA_IGNORE_KEYSTORE_PROPS').toString().toBoolean()

android {
    namespace = "ar.carpincho.rockola"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.carpincho.rockola"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode baseVersionCode
        versionName baseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            versionCode baseVersionCode * 10 + 1
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        x86_64 {
            dimension "abi"
            versionCode baseVersionCode * 10 + 2
            ndk {
                abiFilters "x86_64"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    signingConfigs {
        release {
            def ksPropsFile = rootProject.file('keystore.properties')
            if (!ignoreKeystoreProps && ksPropsFile.exists()) {
                def props = new Properties()
                ksPropsFile.withInputStream { props.load(it) }
                def rawStore = props['storeFile']?.toString()?.trim()
                if (rawStore) {
                    storeFile file(rawStore)
                }
                storePassword props['storePassword']?.toString()
                keyAlias props['keyAlias']?.toString()
                keyPassword props['keyPassword']?.toString()
            } else if (System.getenv('ROCKOLA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ROCKOLA_KEYSTORE_PATH'))
                storePassword(System.getenv('ROCKOLA_KEYSTORE_PASSWORD') ?: System.getenv('ROCKOLA_KEYSTORE_PASS'))
                keyAlias(System.getenv('ROCKOLA_KEY_ALIAS') ?: 'rockola')
                keyPassword(
                    System.getenv('ROCKOLA_KEY_PASSWORD')
                        ?: System.getenv('ROCKOLA_KEY_PASS')
                        ?: System.getenv('ROCKOLA_KEYSTORE_PASSWORD')
                        ?: System.getenv('ROCKOLA_KEYSTORE_PASS')
                )
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "La Rockola (Debug)"
            resValue "string", "title_activity_main", "La Rockola (Debug)"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseSmoke {
            initWith release
            def rc = signingConfigs.release
            def hasReleaseSigning = rc.storeFile != null && rc.storeFile.exists() &&
                rc.storePassword && rc.keyAlias && rc.keyPassword
            signingConfig(hasReleaseSigning ? rc : signingConfigs.debug)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-releasesmoke.pro'
            testProguardFiles 'proguard-androidtest.pro'
            matchingFallbacks = ['release']
        }
    }
    testBuildType(project.findProperty('ROCKOLA_TEST_BUILD_TYPE')?.toString() ?: 'debug')
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackagePattern = ~/^(assemble|bundle|package|sign).*Release$/
    def needsReleaseSigning = taskGraph.allTasks.any {
        it.project == project && (it.name ==~ releasePackagePattern)
    }
    if (needsReleaseSigning) {
        def rc = android.signingConfigs.release
        if (rc.storeFile == null || !rc.storeFile.exists() || !rc.storePassword || !rc.keyAlias || !rc.keyPassword) {
            throw new GradleException(
                "Firma release obligatoria faltante: configurá android/keystore.properties o ROCKOLA_KEYSTORE_PATH / ROCKOLA_KEYSTORE_PASSWORD / ROCKOLA_KEY_ALIAS / ROCKOLA_KEY_PASSWORD."
            )
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.14"
        def customBuildPython = project.findProperty('ROCKOLA_BUILD_PYTHON')?.toString()?.trim()
        if (customBuildPython) {
            buildPython customBuildPython
        } else {
            buildPython "python3.14"
        }
        pip {
            options "--extra-index-url", "https://pypi.flet.dev"
            install "fastapi==0.165.0"
            install "httpx==0.28.1"
            install "uvicorn==0.54.0"
            install "mutagen==1.48.1"
            install "pydantic==2.14.3"
            install "pydantic-core==2.50.4"
            install "pydantic-settings==2.16.3"
            install "websockets==17.4"
            install "edge-tts==7.3.1"
            install "aiohttp==3.14.5"
            install "frozenlist==1.8.0"
            install "multidict==7.2.1"
            install "yarl==1.25.1"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation platform("androidx.compose:compose-bom:2025.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
